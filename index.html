<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolin | Personal website</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      isolation: isolate;
      color: #fff;
      background:
        radial-gradient(ellipse at 52% 48%, #34564570, transparent 45%),
        radial-gradient(ellipse at 14% 80%, #40755a, transparent 60%),
        radial-gradient(ellipse at 88% 20%, #6e9c71, transparent 55%),
        linear-gradient(145deg, #b9d8ba, #8fbba0 55%, #c5dbaf);
    }

    #ink {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main {
      display: grid;
      min-height: inherit;
      place-items: center;
      box-sizing: border-box;
      padding: 32px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font: 400 clamp(1.5rem, 7.1vw, 5.5rem) / 1.08 Georgia, serif;
      letter-spacing: -0.035em;
      text-shadow:
        0 0 2px #112c23,
        0 1px 2px #112c23,
        0 3px 10px #112c23b3,
        0 8px 30px #112c2380;
    }

    h1 a {
      display: inline-block;
      color: inherit;
      text-decoration: none;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.16em;
    }

    h1 a:hover,
    h1 a:focus-visible {
      text-decoration-line: underline;
    }

    h1 a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 8px;
    }
  </style>
  <script src="./ink.js" defer></script>
</head>
<body>
  <canvas id="ink" aria-hidden="true" hidden></canvas>
  <main>
    <h1>
      <a href="https://en.wikisource.org/wiki/The_Prelude_(Wordsworth)/Book_III">
        Voyaging through<br>
        <i>strange eons of thought...</i>
      </a>
    </h1>
  </main>
</body>
</html>
